            - listitem [ref=e1213]:
              - paragraph [ref=e1214]: Wise Payments Limited (Wise) is authorised by the Financial Conduct Authority under the Electronic Money Regulations 2011, Firm Reference 900507, for the issuing of electronic money. Wise works with a local bank partner to offer inward remittance service to India with the approval of the Reserve Bank of India (RBI). Vaho Forex Private Limited holds an Authorised Dealer Category II license with the RBI to provide outward remittance services for limited purposes and forex card services as per applicable laws. Wise Payments India Private Limited currently is an in-principle approved Payment Aggregator - Cross Border.
