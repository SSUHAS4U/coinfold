name: Keep Coinfold API Warm

on:
  workflow_dispatch:
  # Weekdays only, 06:00-17:50 UTC. This is about 260 instance-hours/month,
  # leaving room under Render's 750-hour per-workspace free-tier quota.
  schedule:
    - cron: "*/10 6-17 * * 1-5"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        env:
          HEALTH_URL: https://coinfold-api.onrender.com/health
        run: curl --fail --silent --show-error --max-time 60 "$HEALTH_URL"