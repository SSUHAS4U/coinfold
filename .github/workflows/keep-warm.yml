name: Keep Coinfold API Warm

on:
  workflow_dispatch:
  # Keep the service warm for 23 hours/day. The one-hour gap keeps the worst
  # case below 750 Render instance-hours in a 31-day month.
  schedule:
    - cron: "*/10 0-22 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        env:
          HEALTH_URL: https://coinfold-api.onrender.com/health
        run: curl --fail --silent --show-error --max-time 60 "$HEALTH_URL"